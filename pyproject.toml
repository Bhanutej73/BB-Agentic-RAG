[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhanutej73", email = "bhanutej930@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "pinecone>=10.2.0",
    "pinecone-text>=0.11.0",
    "ragas>=0.4.3",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
